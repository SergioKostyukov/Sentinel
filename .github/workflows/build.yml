name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Monitoring
        run: dotnet restore SentinelApi.Monitoring/SentinelApi.Monitoring.slnx

      - name: Build Monitoring
        run: dotnet build SentinelApi.Monitoring/SentinelApi.Monitoring.slnx --no-restore --configuration Release

      - name: Restore Identity
        run: dotnet restore SentinelApi.Identity/SentinelApi.Identity.slnx

      - name: Build Identity
        run: dotnet build SentinelApi.Identity/SentinelApi.Identity.slnx --no-restore --configuration Release

      - name: Test Identity
        run: dotnet test SentinelApi.Identity/SentinelApi.Identity.slnx --no-restore --configuration Release

      - name: Docker build
        run: docker compose build
